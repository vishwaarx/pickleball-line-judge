[project]
name = "pickle-judge"
version = "0.1.0"
description = "Offline pickleball line judge: phone browsers -> WebRTC -> Mac -> IN/OUT with evidence"
requires-python = ">=3.11"
dependencies = [
  "aiortc>=1.15",
  "av>=14",
  "opencv-python>=4.10",
  "numpy>=2",
  "aiohttp>=3.10",
  "qrcode>=8",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# flat layout with several top-level folders (e2e, static, logs, ...): name what gets installed
[tool.setuptools]
py-modules = ["app", "pipeline", "confirm_jev", "logsetup"]
packages = ["judge", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
